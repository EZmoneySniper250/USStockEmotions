# Local Spark config. On EMR, only the s3a endpoint/credentials and catalog lines change.

spark.master                                   local[*]
spark.driver.memory                            4g
spark.sql.session.timeZone                     UTC
spark.sql.shuffle.partitions                   8

# Delta Lake
spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.schema.autoMerge.enabled false
# Every table is Delta, even if USING DELTA is forgotten (default would be a Hive table)
spark.sql.sources.default                      delta
spark.sql.legacy.createHiveTableByDefault      false

# Object storage: RustFS (S3-compatible) via s3a (switch endpoint -> S3 on AWS)
spark.hadoop.fs.s3a.endpoint                   http://storage:9000
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# Catalog: Hive metastore backed by Postgres (stand-in for Glue Data Catalog).
# Local-dev credentials only.
spark.sql.catalogImplementation                hive
spark.sql.warehouse.dir                        s3a://usse-lake/warehouse
spark.hadoop.javax.jdo.option.ConnectionURL    jdbc:postgresql://metastore-db:5432/metastore
spark.hadoop.javax.jdo.option.ConnectionDriverName org.postgresql.Driver
spark.hadoop.javax.jdo.option.ConnectionUserName hive
spark.hadoop.javax.jdo.option.ConnectionPassword hive
# Schema is created by docker/metastore/*.sql; DataNucleus auto-create deadlocks on Postgres
spark.hadoop.datanucleus.schema.autoCreateAll  false
spark.hadoop.datanucleus.fixedDatastore        true
spark.hadoop.hive.metastore.schema.verification false
